name: release

# The only path that publishes. Manually dispatched, and a dry run unless
# someone explicitly says otherwise (ADR-0009).
#
# There is deliberately no tag or push trigger. Publishing an executable that
# can place orders should be an act a person performs with their name on it, not
# a side-effect of a merge — and a tag is easy to push by accident.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and verify only; nothing leaves this run. Set to false to release what is selected below.'
        type: boolean
        default: true
        required: true
      npm-publish:
        description: 'Publish the SDK and the schema to npm (when dry-run is false).'
        type: boolean
        default: true
        required: true
      cli-bundle:
        description: 'Attach the operator artifacts (CLI + keystore signer) to the GitHub release v<version>. Refused unless ADR-0010 and ADR-0012 are Accepted.'
        type: boolean
        default: false
        required: true

# Least privilege, plus the one token provenance needs. `id-token: write` is
# what lets the registry attest this build to this repository and this workflow;
# without it `--provenance` fails rather than silently publishing unattested.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Every generated artifact must still be the generator's output. A release
      # is the worst moment to discover a hand-edited schema or a stale SBOM.
      - run: pnpm schema:generate
      - run: pnpm instructions:generate
      - run: pnpm sbom:generate
      - name: generated artifacts are reproducible
        run: git diff --exit-code -- schemas/ agent-instructions/ sbom/

      # --strict refuses on anything the preflight could not establish, not just
      # on what it found wrong. An unset repository URL, a dependency whose
      # licence nobody read: each stops the release here, before a version
      # number is burned.
      - name: release preflight (strict)
        run: pnpm release:preflight:strict

      # Read before publishing: the file list is what a stranger installs.
      - name: pack
        run: |
          pnpm --filter @waterx/predict-agent-sdk exec npm pack --dry-run
          pnpm --filter @waterx/predict-agent-schema exec npm pack --dry-run

      # The operator artifacts carry the SDK and the schema inside them, so they
      # do not need these on a registry: the two releases are separate choices.
      - name: publish
        if: ${{ inputs.dry-run == false && inputs.npm-publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `provenance` and `access` come from each package's publishConfig, so
        # they cannot be lost by editing this line.
        run: |
          pnpm --filter @waterx/predict-agent-schema exec npm publish
          pnpm --filter @waterx/predict-agent-sdk exec npm publish

      - name: dry run summary
        if: ${{ inputs.dry-run }}
        run: echo "Dry run. Nothing was published or attached. Re-dispatch with dry-run=false to release what is selected."

  # The operator artifacts (ADR-0010, ADR-0012): the CLI with the two libraries
  # inside it, and the keystore signer beside it, attached to a GitHub release —
  # never published to a registry.
  #
  # Its own job, because it is the only one that needs to write to the
  # repository, and least privilege is per job. It runs only when asked, only
  # for a real release, and only after `release` has passed every gate above.
  # Whether it may run at all is not this file's decision: `cli:bundle --release`
  # reads ADR-0010's and ADR-0012's status and refuses unless both are Accepted.
  cli-bundle:
    needs: release
    if: ${{ inputs.cli-bundle && inputs.dry-run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Install it the way the sentence says, before anyone is told to.
      - run: pnpm cli:bundle:check

      - name: build the release artifacts (refused unless ADR-0010 and ADR-0012 are Accepted)
        run: pnpm cli:bundle -- --release --out "$GITHUB_WORKSPACE/bundle-out"

      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./packages/cli/package.json').version")"
          gh release view "$version" >/dev/null 2>&1 || gh release create "$version" --verify-tag --title "$version" --notes "Operator artifacts. Install both in one command: npm install <CLI asset URL> <keystore asset URL>, then run npx --no waterx-predict next --json and do what it says. Without WATERX_PREDICT_ENVIRONMENT the CLI uses mainnet (ADR-0011)."
          gh release upload "$version" bundle-out/*.tgz bundle-out/SHA256SUMS bundle-out/*.cdx.json --clobber
