name: harness

# The coding-agent files (AGENTS.md at the root, in packages/ and in each package — no
# CLAUDE.md anywhere — .codex/config.toml, docs/knowledge-hub) load in every agent session; this keeps them in
# the shape both tools load. scripts/agent-hooks/check-harness.sh is vendored byte-for-byte from
# Bucket-Protocol/waterx-commons (harness/lint); update it there, then copy it here.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/agent-hooks/check-harness.sh
